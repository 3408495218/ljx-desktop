[package]
name = "lajixia-desktop"
version = "0.1.1"
description = "我的世界垃圾侠重建版桌面客户端"
edition = "2021"

[lib]
name = "lajixia_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crust_core = "1.0"
zip = "2"
sha2 = "0.10"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.13.5", features = ["blocking"] }

[profile.release]
codegen-units = 1
lto = true
strip = true

# 用本地 vendor 覆盖 crust_core：上游把各下载源写成常量、没有配置入口，
# 我们在 vendor/crust_core/src/mirror.rs 里加了国内镜像（BMCLAPI）与官方回退开关。
[patch.crates-io]
crust_core = { path = "vendor/crust_core" }
